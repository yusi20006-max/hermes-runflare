name: bale-platform
label: Bale
kind: platform
description: >
  Bale gateway adapter for Hermes Agent using the Bale Bot API.
version: 1.1.0
author: yusi20006-max
requires_env:
  - name: BALE_BOT_TOKEN
    description: "Bale bot token"
    prompt: "Bale bot token"
optional_env:
  - name: BALE_ALLOWED_USERS
    description: "Comma-separated Bale user IDs allowed to chat"
  - name: BALE_CHAT_ID
    description: "Bale chat ID additionally allowed to chat"
  - name: BALE_ALLOW_ALL_USERS
    description: "If set to a truthy value, allow all Bale users"
  - name: BALE_HOME_CHANNEL
    description: "Default Bale chat ID for cron/notification delivery"
