name: CI

on:
  push:
    branches: ["master", "feat/**"]
  pull_request:
    branches: ["master"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test runner
        run: python3 -m pip install --disable-pip-version-check pytest

      - name: Run deployment regression tests
        run: python3 -m pytest -q tests/test_bale_deployment.py

      - name: Build Runflare image
        run: docker build --pull -t hermes-runflare:test .
